<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Website</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* Gallery styling */
    .gallery-img {
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    .gallery-img:hover {
      transform: scale(1.05);
    }
    .responsive {
      padding: 6px;
    }
  </style>
</head>
<body>

  <!-- Hero Section -->
  <div class="jumbotron text-center bg-primary text-white py-5 mb-0">
    <h1>Code To Creation</h1>
    <p>Portfolio</p>
  </div>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">SCW</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="./home.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="./about.html">About Us</a></li>
          <li class="nav-item"><a class="nav-link" href="./gallery.html">Gallery</a></li>
          <li class="nav-item"><a class="nav-link" href="./contacts.html">Contacts</a></li>
          <li class="nav-item"><a class="nav-link" href="./projects.html">Projects</a></li>
          <li class="nav-item"><a class="nav-link" href="./skills.html">Skills</a></li>
          <li class="nav-item"><a class="nav-link" href="./achievements.html">Achievements</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Gallery Section -->
  <div class="container my-5">
    <h2 class="text-center mb-4">Responsive Image Gallery</h2>
    <div class="row">
      
      <!-- Image 1 -->
      <div class="col-6 col-md-3 responsive">
        <img src="images/img.jpg" class="img-fluid rounded gallery-img" alt="Los Angeles" data-bs-toggle="modal" data-bs-target="#galleryModal" data-bs-slide-to="0">
      </div>

      <!-- Image 2 -->
      <div class="col-6 col-md-3 responsive">
        <img src="images/img1.jpg" class="img-fluid rounded gallery-img" alt="Chicago" data-bs-toggle="modal" data-bs-target="#galleryModal" data-bs-slide-to="1">
      </div>

      <!-- Image 3 -->
      <div class="col-6 col-md-3 responsive">
        <img src="images/img2.jpg" class="img-fluid rounded gallery-img" alt="New York" data-bs-toggle="modal" data-bs-target="#galleryModal" data-bs-slide-to="2">
      </div>

      <!-- Image 4 -->
      <div class="col-6 col-md-3 responsive">
        <img src="images/img3.jpg" class="img-fluid rounded gallery-img" alt="Mountains" data-bs-toggle="modal" data-bs-target="#galleryModal" data-bs-slide-to="3">
      </div>

      <!-- Image 5 -->
      <div class="col-6 col-md-3 responsive">
        <img src="images/img4.jpg" class="img-fluid rounded gallery-img" alt="River" data-bs-toggle="modal" data-bs-target="#galleryModal" data-bs-slide-to="4">
      </div>

    </div>
  </div>

  <!-- Modal with Carousel -->
  <div class="modal fade" id="galleryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content bg-dark">
        <div class="modal-body p-0">
          <div id="carouselGallery" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">
              
              <div class="carousel-item active">
                <img src="images/img.jpg" class="d-block w-100" alt="Los Angeles">
              </div>
              <div class="carousel-item">
                <img src="images/img1.jpg" class="d-block w-100" alt="Chicago">
              </div>
              <div class="carousel-item">
                <img src="images/img2.jpg" class="d-block w-100" alt="New York">
              </div>
              <div class="carousel-item">
                <img src="images/img3.jpg" class="d-block w-100" alt="Mountains">
              </div>
              <div class="carousel-item">
                <img src="images/img4.jpg" class="d-block w-100" alt="River">
              </div>

            </div>
            <!-- Controls -->
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselGallery" data-bs-slide="prev">
              <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselGallery" data-bs-slide="next">
              <span class="carousel-control-next-icon"></span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
</body>
</html>
